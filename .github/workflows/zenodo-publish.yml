name: Publicar dataset en Zenodo

on:
  workflow_run:
    workflows: ["Actualización mensual"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests openpyxl

      - name: Publicar en Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_DEPOSIT_ID: ${{ secrets.ZENODO_DEPOSIT_ID }}
        run: python3 dataset/scripts/zenodo_publish.py

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/components/ExportButton.tsx
          git diff --staged --quiet && echo "Sin cambios, nada que commitear." || \
            git commit -m "web: sincroniza enlace de descarga con la última versión de Zenodo"
          git pull --rebase origin main
          git push
