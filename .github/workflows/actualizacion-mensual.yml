name: Actualización mensual

on:
  schedule:
    - cron: '0 5 1 * *'   # Día 1 de cada mes a las 5:00 UTC
  workflow_dispatch:        # Permite lanzarlo manualmente desde GitHub

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: dataset/requirements.txt

      - name: Instalar dependencias Python
        run: pip install -r dataset/requirements.txt

      - name: Comprobar actividad en Bluesky
        run: python3 dataset/scripts/check_activity.py --bluesky

      - name: Comprobar actividad en Mastodon
        run: python3 dataset/scripts/check_activity.py --mastodon

      - name: Comprobar actividad en Twitter/X
        timeout-minutes: 320
        env:
          GETXAPI_TOKEN: ${{ secrets.GETXAPI_TOKEN }}
        run: |
          if [ -z "$GETXAPI_TOKEN" ]; then
            echo "GETXAPI_TOKEN no configurado, saltando Twitter/X"
            exit 0
          fi
          # Reintenta varias veces el mismo día, retomando desde donde se
          # quedó (dataset/scripts/check_activity.py guarda el progreso
          # solo en el runner, sin commitear nada parcial). Solo se da la
          # comprobación por buena si un intento recorre la lista completa.
          for intento in 1 2 3 4 5; do
            echo "== Comprobación Twitter/X, intento $intento =="
            if python3 dataset/scripts/check_activity.py --twitter --token "$GETXAPI_TOKEN" --time-limit 55; then
              echo "Comprobación de Twitter/X completada."
              exit 0
            else
              codigo=$?
              if [ $codigo -eq 2 ]; then
                echo "Comprobación incompleta, reintentando desde donde se quedó..."
              else
                echo "::error::Fallo irrecuperable en la comprobación de Twitter/X (código $codigo)."
                exit 1
              fi
            fi
          done
          echo "::error::No se completó la comprobación de Twitter/X tras $intento intentos."
          exit 1

      - name: Exportar a JSON
        run: python3 dataset/scripts/export.py

      - name: Guardar snapshot histórico
        run: |
          DATE=$(date -u +%Y-%m-01)
          mkdir -p dataset/historical
          cp src/data/total.json "dataset/historical/${DATE}.json"

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/ dataset/datosfinales.xlsx dataset/historical/
          git diff --staged --quiet && echo "Sin cambios, nada que commitear." || \
            git commit -m "datos: actualización mensual $(date -u +%Y-%m-01)"
          git pull --rebase origin main
          git push

      - name: Verificar snapshot histórico
        run: |
          DATE=$(date -u +%Y-%m-01)
          if ! git ls-tree -r HEAD --name-only | grep -qx "dataset/historical/${DATE}.json"; then
            echo "::error::El snapshot histórico dataset/historical/${DATE}.json no quedó registrado en el repositorio (posible pérdida en un merge/rebase)."
            exit 1
          fi
          echo "Snapshot histórico confirmado en el repositorio: dataset/historical/${DATE}.json"
